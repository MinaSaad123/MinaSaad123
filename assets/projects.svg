<text x="28" y="66" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" fill="#00b4d8">C  ·  Linux  ·  libpcap</text>
<text x="28" y="94" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Packet sniffer in the spirit of Wireshark and tcpdump.</text><text x="28" y="113" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Parses IP, TCP, UDP, ICMP, HTTP, DNS and FTP using multi-</text><text x="28" y="132" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">level inheritance.</text>
<rect x="456.5" y="4.5" width="439" height="150" rx="12" fill="url(#cb)" stroke="#30363d"/>
<rect x="456.5" y="4.5" width="439" height="150" rx="12" fill="none" stroke="url(#cm)" stroke-width="2.5" pathLength="100" stroke-dasharray="18 82"><animate attributeName="stroke-dashoffset" values="100;0" dur="6s" begin="1.3s" repeatCount="indefinite"/></rect>
<circle cx="484" cy="34" r="5" fill="#3fb950"><animate attributeName="opacity" values="1;.3;1" dur="2s" begin="1.3s" repeatCount="indefinite"/></circle>
<text x="500" y="40" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">RTOS from Scratch</text>
<text x="480" y="66" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" fill="#00b4d8">ARM Assembly  ·  C</text>
<text x="480" y="94" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Scheduler using PendSV for context switching and SVC for</text><text x="480" y="113" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">self-interrupts, with round-robin scheduling, task delays</text><text x="480" y="132" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">and mutex synchronization.</text>
<rect x="4.5" y="171.5" width="439" height="150" rx="12" fill="url(#cb)" stroke="#30363d"/>
<rect x="4.5" y="171.5" width="439" height="150" rx="12" fill="none" stroke="url(#cm)" stroke-width="2.5" pathLength="100" stroke-dasharray="18 82"><animate attributeName="stroke-dashoffset" values="100;0" dur="6s" begin="2.6s" repeatCount="indefinite"/></rect>
<circle cx="32" cy="201" r="5" fill="#3fb950"><animate attributeName="opacity" values="1;.3;1" dur="2s" begin="2.6s" repeatCount="indefinite"/></circle>
<text x="48" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">C++ Utilities Library</text>
<text x="28" y="233" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" fill="#00b4d8">C++17 / 20  ·  Type traits  ·  Concepts</text>
<text x="28" y="261" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">My own smart pointers, containers, iterators and utilities,</text><text x="28" y="280" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">plus tuple, move and forward, built with type traits and</text><text x="28" y="299" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">concepts.</text>
