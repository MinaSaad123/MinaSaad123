<text x="500" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">HTTP Server</text>
<text x="480" y="233" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" fill="#00b4d8">C  ·  Sockets  ·  Linux</text>
<text x="480" y="261" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">HTTP server that accepts and handles client requests over</text><text x="480" y="280" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">sockets.</text>
