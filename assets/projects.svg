<text x="48" y="374" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Custom Shell</text>
<text x="28" y="400" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" fill="#00b4d8">C  ·  Linux</text>
<text x="28" y="428" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Shell built from scratch with internal and external command execution, redirection and pipelining.</text>
