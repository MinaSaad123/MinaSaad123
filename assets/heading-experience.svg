<svg xmlns="http://www.w3.org/2000/svg" width="900" height="52" viewBox="0 0 900 52" role="img" aria-label="Experience">
<title>Experience</title>
<defs>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A66C2"/><stop offset="1" stop-color="#00b4d8"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity=".9"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
<radialGradient id="dot"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="7" width="190" height="38" rx="9" fill="#0d1117" stroke="url(#hg)" stroke-width="1.5"/>
<rect x="16" y="20" width="12" height="12" rx="3" fill="#58a6ff"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="rotate" values="0 22 26;90 22 26" dur="4s" repeatCount="indefinite"/></rect>
<text x="40" y="33" font-family="'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace" font-size="18" font-weight="700" fill="#e6edf3" letter-spacing="1.5">EXPERIENCE</text>
<line x1="206" y1="26" x2="896" y2="26" stroke="url(#hl)" stroke-width="2" stroke-linecap="round"/>
<circle r="7" cy="26" fill="url(#dot)"><animate attributeName="cx" values="206;890" dur="3.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>
