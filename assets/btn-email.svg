<svg xmlns="http://www.w3.org/2000/svg" width="210" height="52" viewBox="0 0 210 52" role="img" aria-label="Email me">
<title>Email me</title>
<defs>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7b72" stop-opacity="0"/><stop offset="1" stop-color="#ff7b72"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="bc"><rect x="1" y="1" width="208" height="50" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="208" height="50" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="208" height="50" rx="12" fill="none" stroke="url(#cg)" stroke-width="2.5" pathLength="100" stroke-dasharray="26 74">
  <animate attributeName="stroke-dashoffset" values="100;0" dur="3.4s" repeatCount="indefinite"/></rect>
<g clip-path="url(#bc)"><rect x="-70" y="0" width="60" height="52" fill="url(#sh)" transform="skewX(-20)">
  <animateTransform attributeName="transform" type="translate" values="-20 0;300 0" dur="3.4s" repeatCount="indefinite" additive="sum"/></rect></g>
<g transform="translate(24 14)" fill="none" stroke="#ff7b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <animateTransform attributeName="transform" type="translate" values="24 14;24 11;24 14" dur="2.4s" repeatCount="indefinite"/><rect x="0" y="3" width="24" height="18" rx="3"/><polyline points="1,5 12,14 23,5"/></g>
<text x="66" y="32" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Email me</text>
</svg>
